name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ------------------------------------------------------------
  # Existing pytest job (UNCHANGED)
  # ------------------------------------------------------------
  test:
    name: Test Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.8
        uses: actions/setup-python@v3
        with:
          python-version: 3.8

      - name: Install package and testing tools
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Test with pytest
        run: pytest -v pnpflow/

  # ------------------------------------------------------------
  # NEW: Step 6 blind PnP-Flow experiment
  # ------------------------------------------------------------
  step6:
    name: Step 6 – Blind PnP-Flow (B=4,8)
    runs-on: ubuntu-latest
    needs: test   # only run if tests pass

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Step 6 (batch sizes 4 and 8)
        run: |
          echo "Running Step 6 automated sweep (B=4,8)"
          python blind_pnp_flow.py
