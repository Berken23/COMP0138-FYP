name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  step6:
    name: Step 6 – Blind PnP-Flow (B=4,8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -e . --no-deps
          pip install torch torchvision torchdiffeq pillow pyyaml numpy

      - name: Run Step 6 (batch sizes 4 and 8)
        run: |
          echo "Running Step 6 automated sweep (B=4,8)"
          python pnpflow/methods/blind_pnp_flow.py
